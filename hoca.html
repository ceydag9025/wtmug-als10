<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3d91">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Hoca Modu</title>
</head>
<body>
  <header>
    <a href="index.html" class="back">← Ana Sayfa</a>
    <h1>🧑‍🏫 Hoca Modu</h1>
    <span id="status" class="status">Başlatılıyor...</span>
  </header>
  <main>
    <section class="panel">
      <h2>1. Dosya seç</h2>
      <input type="file" id="fileInput" hidden>
      <button id="pickBtn" class="primary">📁 Dosya Seç</button>
      <div id="fileName" class="muted" style="margin-top:8px;">Henüz dosya seçilmedi</div>
    </section>

    <section id="qrSection" class="panel hidden">
      <h2>2. Öğrenciler bağlansın</h2>
      <div class="qr-wrap">
        <canvas id="qrcode"></canvas>
        <div class="qr-info">
          <div class="muted">Hoca ID:</div>
          <div id="peerId" class="peer-id"></div>
          <div class="muted" style="margin-top:8px;">Bağlantı linki:</div>
          <div class="link-row">
            <input id="linkOut" readonly>
            <button id="copyLink">Kopyala</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>3. Gönderim Günlüğü</h2>
      <div class="stats">
        <div class="stat">👥 Bağlı Öğrenci: <b id="studentCount">0</b></div>
        <div class="stat">✅ Tamamlayan: <b id="doneCount">0</b></div>
      </div>
      <div id="students" class="students"></div>
      <h3 style="margin-top:16px;">Canlı Günlük</h3>
      <div id="log" class="log"></div>
    </section>
  </main>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="common.js"></script>
  <script src="hoca.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
