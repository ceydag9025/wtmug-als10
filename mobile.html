<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b3d91">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=9">
  <title>Sohbet — Telefon</title>
</head>
<body>
  <header>
    <a href="index.html" class="back">← Ana Sayfa</a>
    <h1>📱 Sohbet — Telefon</h1>
    <span id="status" class="status">Hazır</span>
  </header>
  <main>
    <section id="connect" class="panel">
      <h2>Bilgisayara bağlan</h2>
      <button id="scanBtn" class="primary">📷 Kamera ile QR Oku</button>
      <div id="scanner" class="scanner hidden"></div>
      <div class="manual" style="margin-top:16px;">
        <label class="muted">Bağlantı linki veya Peer ID:</label>
        <input id="manualLink" placeholder="https://.../mobile.html#peer=w-xxx veya w-xxx">
        <button id="connectManualBtn" style="margin-top:8px;">Bağlan</button>
      </div>
    </section>

    <section id="chat" class="panel hidden">
      <div id="messages" class="messages"></div>
      <div class="composer">
        <input type="file" id="fileInput" hidden multiple>
        <button id="attachBtn">📎</button>
        <textarea id="textInput" placeholder="Mesaj yaz..."></textarea>
        <button id="sendBtn" class="primary">Gönder</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js'"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
          onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'"></script>
  <script src="common.js?v=9"></script>
  <script src="mobile.js?v=9"></script>
  <script src="sw-register.js?v=9"></script>
</body>
</html>>
